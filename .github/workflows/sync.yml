name: Günlük Hukuki Veri Senkronizasyonu

on:
  schedule:
    # Her gece saat 03:00'te (Türkiye Saati / UTC 00:00) çalışır
    - cron: '0 0 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Hukuki Veri Çekiciyi Çalıştır
        run: |
          python sync_legal_data.py

      - name: Değişiklikleri GitHub'a Otomatik Kaydet
        run: |
          git config --global user.name "HukukBilgini Bot"
          git config --global user.email "bot@hukukbilgini.internal"
          git add legal_database.json sync_changelog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): Hukuki veriler %0 hata ile güncellendi [$(date +'%Y-%m-%d')]" && git push)
